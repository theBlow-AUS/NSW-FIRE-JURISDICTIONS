openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /map-feeds:
    get:
      operationId: getMapFeed
      summary: Ingest public HTTPS RSS, Atom, GeoRSS or RFS FireDangerMap XML.
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
        - in: query
          name: refresh
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Normalized GeoJSON entries with source dates, geometry provenance and stale warnings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid or unsafe feed URL or document.
        '502':
          description: Feed unavailable and no last-good snapshot exists.
  /fire-context:
    get:
      operationId: getFireContext
      tags: [fire]
      summary: Check FRNSW coverage before applying LGA-based RFS information
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Location context with dated source information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FireContext" }
        "400":
          description: Invalid coordinates
  /rfs/status:
    get:
      operationId: getRfsStatus
      tags: [fire]
      summary: View cached source freshness and refresh schedule
      responses:
        "200":
          description: Update status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RfsUpdateStatus" }
  /rfs/snapshot:
    get:
      operationId: getRfsSnapshot
      tags: [fire]
      summary: Download the currently cached RFS snapshot without scraping
      responses:
        "200":
          description: Cached data and provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RfsSnapshotOutput" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PermitRecord:
      type: object
      required: [lga, required]
      properties:
        lga: { type: string }
        required: { type: boolean }
    FireContact:
      type: object
      required: [lga, district, phone, address]
      properties:
        lga: { type: string }
        district: { type: string }
        phone: { type: string }
        address: { type: string }
    RfsSourceStatus:
      type: object
      required: [sourceUrl, retrievedAt, lastAttemptAt, error, stale, recordCount]
      properties:
        sourceUrl: { type: string }
        retrievedAt: { type: string }
        lastAttemptAt: { type: [string, "null"] }
        error: { type: [string, "null"] }
        stale: { type: boolean }
        recordCount: { type: integer }
    RfsUpdateStatus:
      type: object
      required: [permits, directory, nextRefreshAt, schedule]
      properties:
        permits: { $ref: "#/components/schemas/RfsSourceStatus" }
        directory: { $ref: "#/components/schemas/RfsSourceStatus" }
        nextRefreshAt: { type: string }
        schedule: { type: string }
    RfsSnapshot:
      type: object
      required: [permitRows, contacts, permitRetrievedAt, contactsRetrievedAt]
      properties:
        permitRows:
          type: array
          items: { $ref: "#/components/schemas/PermitRecord" }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/FireContact" }
        permitRetrievedAt: { type: string }
        contactsRetrievedAt: { type: string }
    RfsSnapshotOutput:
      type: object
      required: [snapshot, status]
      properties:
        snapshot: { $ref: "#/components/schemas/RfsSnapshot" }
        status: { $ref: "#/components/schemas/RfsUpdateStatus" }
    FireContext:
      type: object
      required: [kind, checkedAt, district, lga, permitRequired, contacts, message, status, localCopy, warnings]
      properties:
        kind: { type: string, enum: [frnsw, rural, outside, error] }
        checkedAt: { type: string }
        district: { type: [string, "null"] }
        lga: { type: [string, "null"] }
        permitRequired: { type: [boolean, "null"] }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/FireContact" }
        message: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RfsUpdateStatus" }
        localCopy: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

